<title>Meu Plano Financeiro</title>
<style>
:root{
  --bg:#071426;--panel:#0d2038;--panel2:#102944;--line:#1d3a5c;
  --text:#f5f8fc;--muted:#9bb0c8;--green:#37d492;--yellow:#ffd166;
  --orange:#ff9f43;--red:#ff6b6b;--blue:#6ea8fe;--purple:#b794f4;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#06111f 0%,#091a2e 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1440px;margin:auto;min-height:100vh}
.topbar{display:flex;align-items:center;gap:18px;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,20,38,.96);backdrop-filter:blur(12px);z-index:10}
.brand{font-weight:800;font-size:20px;white-space:nowrap;display:flex;align-items:center;gap:10px}.brand-icon{width:38px;height:38px;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.25);flex:0 0 auto}.brand-text{display:block}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.nav{display:flex;gap:6px;overflow:auto}
.nav button{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:10px}
.nav button.active{background:var(--panel2);color:white}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.month-picker{background:var(--panel);border:1px solid var(--line);color:white;padding:9px 10px;border-radius:10px}
.main{padding:24px}
.screen{display:none}.screen.active{display:block}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:rgba(13,32,56,.92);border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi{grid-column:span 3;min-height:135px}
.kpi .label{font-size:13px;color:var(--muted);margin-bottom:12px}
.kpi .value{font-size:28px;font-weight:800}
.kpi .sub{margin-top:9px;font-size:12px;color:var(--muted)}
.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.info{color:var(--blue)}
.span8{grid-column:span 8}.span4{grid-column:span 4}.span12{grid-column:span 12}.span6{grid-column:span 6}
.section-title{font-weight:800;margin-bottom:14px;font-size:16px}
.progress{height:9px;background:#09182a;border-radius:999px;overflow:hidden;border:1px solid #17324f}
.progress>div{height:100%;border-radius:999px;background:var(--green)}
.progress.yellow>div{background:var(--yellow)}.progress.red>div{background:var(--red)}.progress.blue>div{background:var(--blue)}
.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.month-bars{display:flex;align-items:end;gap:8px;height:210px;padding-top:10px}
.month-col{flex:1;text-align:center;min-width:34px}
.bar-wrap{height:160px;display:flex;align-items:end;gap:3px;justify-content:center}
.bar{width:12px;border-radius:5px 5px 2px 2px;background:var(--blue);min-height:1px}
.bar.target{background:#284968}
.month-col label{display:block;margin-top:7px;color:var(--muted);font-size:11px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.alert{padding:12px 14px;border-radius:12px;background:#102944;border:1px solid #24496f;margin-top:10px;font-size:13px;line-height:1.45}
.alert.good{background:rgba(55,212,146,.08);border-color:rgba(55,212,146,.32)}
.alert.warn{background:rgba(255,209,102,.08);border-color:rgba(255,209,102,.32)}
.alert.bad{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.32)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:860px}
th,td{padding:13px 12px;border-bottom:1px solid #17324f;text-align:left;font-size:13px}
th{color:var(--muted);font-weight:600;background:#0b1b30;position:sticky;top:0}
tr:last-child td{border-bottom:0}
.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}
.pill.good{background:rgba(55,212,146,.12)}.pill.warn{background:rgba(255,209,102,.12)}.pill.bad{background:rgba(255,107,107,.12)}
.btn{border:1px solid var(--line);background:var(--panel2);color:white;border-radius:10px;padding:10px 13px;font-weight:700}
.btn.primary{background:var(--green);border-color:var(--green);color:#052019}
.btn.danger{background:transparent;border-color:#6c2f39;color:#ff9a9a}
.btn.ghost{background:transparent}
.btn.small{padding:7px 9px;font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}
.field{grid-column:span 4}.field.half{grid-column:span 6}.field.full{grid-column:span 12}.field.quarter{grid-column:span 3}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.field input,.field select{width:100%;background:#081a2e;color:white;border:1px solid var(--line);border-radius:10px;padding:11px}
.field input:focus,.field select:focus{outline:2px solid rgba(110,168,254,.35);border-color:var(--blue)}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.hidden{display:none!important}
.package-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pkg-mini{padding:13px;border:1px solid var(--line);border-radius:12px;background:#0a1a2e}
.pkg-mini b{display:block;margin-bottom:4px;font-size:13px}
.pkg-mini span{font-size:12px;color:var(--muted)}
.big-number{font-size:38px;font-weight:900;letter-spacing:-1px}
.callout{padding:18px;border:1px dashed #31597f;border-radius:14px;background:rgba(110,168,254,.05)}
.receivable{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #17324f}
.receivable:last-child{border:0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.footer-note{margin-top:18px;color:var(--muted);font-size:11px;line-height:1.5}
@media(max-width:1000px){
  .kpi{grid-column:span 6}.span8,.span4,.span6{grid-column:span 12}
  .package-list{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .topbar{padding:12px;align-items:flex-start;flex-wrap:wrap}.brand{width:100%}.top-actions{margin-left:0;width:100%}.month-picker{flex:1}
  .main{padding:14px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:24px}
  .kpi{grid-column:span 12}.field,.field.half,.field.quarter{grid-column:span 12}
  .package-list{grid-template-columns:1fr}.card{padding:14px}
  .nav{width:100%}.nav button{white-space:nowrap}
}

.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.asset-card{background:#0a1a2e;border:1px solid var(--line);border-radius:14px;padding:15px}
.asset-card .asset-name{font-weight:800;font-size:14px}
.asset-card .asset-inst{font-size:11px;color:var(--muted);margin-top:3px}
.asset-card .asset-value{font-size:24px;font-weight:900;margin-top:13px}
.asset-card .asset-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:11px;color:var(--muted)}
@media(max-width:900px){.asset-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.asset-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

function loadState(){
  try{
    const x = JSON.parse(localStorage.getItem("meuPlanoFinanceiroV1"));
    if(x && x.settings && Array.isArray(x.transactions)) {
      const oldVersion=Number(x.dataVersion||1);
      x.budgets = x.budgets || makeDefaultBudgets();
      if(oldVersion<8){
        x.budgets["2026-10"]={"Gastos domésticos":3500,"Gastos financeiros":2480,"Gastos com saúde":1500,"Gastos com transporte":1500,"Gastos com alimentação":2100,"Gastos com lazer e entretenimento":4200,"Gastos pessoais":2120,"Gastos com educação":300,"Outros gastos":300,"Gastos com pet":0};
      }
      x.receivables = [];
      if(!Array.isArray(x.assetAccounts) || !x.assetAccounts.length){
        x.assetAccounts=[{id:"asset-checking",name:"Conta corrente / reserva",institution:"Conta corrente",category:"Caixa",openingBalance:0,openingDate:"2026-09-01"}];
      }
      if(!Array.isArray(x.assetTransactions)) x.assetTransactions=[];
      x.deletedSeedKeys = Array.isArray(x.deletedSeedKeys) ? x.deletedSeedKeys : [];

      if(oldVersion<3 || x.settings.openingReceivable===undefined){
        x.settings.openingReceivable=0;
        x.settings.openingReceivableDate="2026-09-04";
      }
      if(!x.settings.openingReceivableLabel){
        x.settings.openingReceivableLabel="Saldo inicial a receber";
      }

      // V7: setembro é o mês do salário que paga a fatura atual.
      // Portanto, as parcelas ativas que constam na fatura paga em setembro
      // reduzem o orçamento de setembro. As parcelas seguintes continuam
      // projetadas para outubro em diante.
      if(oldVersion<7){
        x.transactions = x.transactions.filter(t=>
          !(t.seedKey && (
            t.seedKey.startsWith("fatura-2026-09-row-") ||
            t.seedKey.startsWith("pendente-pos-fatura-2026-09-row-")
          )) &&
          t.source!=="Fatura C6 10/09/2026" &&
          t.source!=="Parcelas pendentes após fatura C6 10/09/2026"
        );
        SEEDED_INSTALLMENTS.forEach(seed=>x.transactions.push(JSON.parse(JSON.stringify(seed))));
      }else{
        const existingSeeds = new Set(x.transactions.map(t=>t.seedKey).filter(Boolean));
        SEEDED_INSTALLMENTS.forEach(t=>{
          if(!existingSeeds.has(t.seedKey) && !x.deletedSeedKeys.includes(t.seedKey)){
            x.transactions.push(JSON.parse(JSON.stringify(t)));
          }
        });
      }

      x.transactions.forEach(t=>{
        if(t.type==="reimbursement"){ t.type="income"; t.account="Reembolso"; }
        if(t.type==="investment") t.legacyMovement=true;
      });

      x.dataVersion = DATA_VERSION;
      localStorage.setItem("meuPlanoFinanceiroV1",JSON.stringify(x));
      return x;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function daysInMonth(k){const [y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()}
function monthAdd(k,n){let [y,m]=k.split("-").map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}

function budgetForMonth(k){

    const y=Number(k.slice(0,4));
    state.budgets[k]= y>=2027 ? JSON.parse(JSON.stringify(STRUCTURAL_2027)) : Object.fromEntries(ORDER.map(p=>[p,0]));
  }

}
function budgetTotal(k){return Object.values(budgetForMonth(k)).reduce((a,b)=>a+(Number(b)||0),0)}
function structuralTarget(){return state.settings.monthlySalary*(1-state.settings.savingsRate)}
function structuralSaving(){return state.settings.monthlySalary*state.settings.savingsRate}

function installmentsFor(tx){
  if(tx.type!=="expense") return [];
  const n=Math.max(1,Number(tx.installments)||1), cur=Math.max(1,Number(tx.currentInstallment)||1);
  const start=tx.dueMonth || txMonth(tx.date);
  const perGross=Number(tx.total||0)/n;
  const reimb=Math.min(Number(tx.reimbursable||0),Number(tx.total||0));
  const perPersonal=(Number(tx.total||0)-reimb)/n;
  const arr=[];
  for(let i=cur;i<=n;i++){
    arr.push({month:monthAdd(start,i-cur),gross:perGross,personal:perPersonal,installment:i,total:n});
  }
  return arr;
}
function monthMetrics(k){
  let gross=0,personal=0,newCommit=0,deferredCommit=0,deferredGrossCommit=0,extraIncome=0,recordedSalary=0,invest=0,reimbReceived=0,newReceivable=0;
  const byPkg=Object.fromEntries(ORDER.map(p=>[p,{personal:0,gross:0,commit:0,deferredCommit:0,deferredGrossCommit:0,future:0,futureGross:0}]));
  state.transactions.forEach(tx=>{
    if(tx.type==="expense"){
      const reimb=Math.min(Number(tx.reimbursable||0),Number(tx.total||0));
      const ownTotal=Number(tx.total||0)-reimb;
      let currentPersonalImpact=0,currentGrossImpact=0;
      const insts=installmentsFor(tx);
      insts.forEach(inst=>{
        if(inst.month===k){
          gross+=inst.gross;personal+=inst.personal;
          currentPersonalImpact+=inst.personal;currentGrossImpact+=inst.gross;
          if(byPkg[tx.package]){
            byPkg[tx.package].gross+=inst.gross;
            byPkg[tx.package].personal+=inst.personal;
          }
        }
        if(inst.month>k && byPkg[tx.package]){
          byPkg[tx.package].future+=inst.personal;
          byPkg[tx.package].futureGross+=inst.gross;
        }
      });
      if(txMonth(tx.date)===k){
        newCommit += ownTotal;
        const deferred=Math.max(0,ownTotal-currentPersonalImpact);
        deferredCommit += deferred;

        // Gerencial de caixa: até o reembolso entrar, o compromisso é a parcela bruta.
        const grossTotal=Number(tx.total||0);
        const deferredGross=Math.max(0,grossTotal-currentGrossImpact);
        deferredGrossCommit += deferredGross;

        if(reimb>0 && !tx.receivableIncludedInOpening) newReceivable += reimb;
        if(byPkg[tx.package]){
          byPkg[tx.package].commit += ownTotal;
          byPkg[tx.package].deferredCommit += deferred;
          byPkg[tx.package].deferredGrossCommit += deferredGross;
        }
      }
    } else if(tx.type==="income" && txMonth(tx.date)===k){
      const account=tx.account||"Receita extra";
      if(account==="Salário / Pró-labore") recordedSalary+=Number(tx.total||0);
      else if(account==="Reembolso") reimbReceived+=Number(tx.total||0);
      else extraIncome+=Number(tx.total||0);
    } else if(tx.type==="reimbursement" && txMonth(tx.date)===k) reimbReceived+=Number(tx.total||0);
    else if(tx.type==="investment" && txMonth(tx.date)===k) invest+=Number(tx.total||0);
  });
  const salary=recordedSalary>0?recordedSalary:state.settings.monthlySalary;
  const budget=budgetTotal(k);
  const netCashSpend=gross-reimbReceived;
  const managerialCashSpend=netCashSpend+deferredGrossCommit;
  return {gross,personal,newCommit,deferredCommit,deferredGrossCommit,managerialCashSpend,extraIncome,invest,reimbReceived,newReceivable,byPkg,salary,budget,
    netCashSpend,
    savingPotential:salary+extraIncome-netCashSpend,
    remaining:budget-netCashSpend,
    managerialRemaining:budget-managerialCashSpend};
}
function annualMetrics(year, throughMonth){
  let personal=0,extraIncome=0,invest=0,salary=0;
  const through=Number(throughMonth||12);
  for(let m=1;m<=through;m++){
    const mm=monthMetrics(`${year}-${String(m).padStart(2,"0")}`);
    personal+=mm.personal;extraIncome+=mm.extraIncome;invest+=mm.invest;salary+=mm.salary;
  }
  if(Number(state.settings.openingYear)===Number(year)){
    personal += Number(state.settings.openingPersonalSpend)||0;
    invest += Number(state.settings.openingInvestments)||0;
  }
  const income=salary+extraIncome;
  return {income,personal,invest,potential:income-personal,rate:income?((income-personal)/income):0,target:salary*state.settings.savingsRate};
}

function assetAccountById(id){return (state.assetAccounts||[]).find(a=>a.id===id)}
function assetTxSigned(t){
  const v=Number(t.amount||0);
  if(t.type==="application"||t.type==="yield"||t.type==="adjustment") return v;
  if(t.type==="withdrawal") return -v;
  return 0;
}
function assetBalance(accountId, throughDate="9999-12-31"){
  const a=assetAccountById(accountId); if(!a)return 0;
  let bal=Number(a.openingBalance||0);
  (state.assetTransactions||[]).forEach(t=>{
    if(t.accountId===accountId && String(t.date||"")<=throughDate) bal+=assetTxSigned(t);
  });
  return bal;
}
function totalInvestedAssets(throughDate="9999-12-31"){

function assetMonthMetrics(k){
  let applications=0,withdrawals=0,yields=0,adjustments=0;
  (state.assetTransactions||[]).forEach(t=>{
    if(txMonth(t.date)!==k)return;
    const v=Number(t.amount||0);
    if(t.type==="application")applications+=v;
    else if(t.type==="withdrawal")withdrawals+=v;
    else if(t.type==="yield")yields+=v;
    else if(t.type==="adjustment")adjustments+=v;
  });
  return {applications,withdrawals,yields,adjustments,netInvested:applications-withdrawals};
}

function receivableMetrics(k){
  const openingAmount=Number(state.settings.openingReceivable||0);
  const openingDate=state.settings.openingReceivableDate||"2026-09-04";
  const monthStart=`${k}-01`;
  const nextMonth=monthAdd(k,1)+"-01";
  let opening=0,newReceivables=0,reimbursements=0;
  if(k>=openingDate.slice(0,7)) opening=openingAmount;
  state.transactions.forEach(t=>{
    if(t.type==="expense" && Number(t.reimbursable||0)>0 && !t.receivableIncludedInOpening){
      const amt=Number(t.reimbursable||0);
      if(t.date<monthStart) opening+=amt;
      else if(t.date>=monthStart && t.date<nextMonth) newReceivables+=amt;
    }
    if(t.type==="reimbursement" || (t.type==="income" && t.account==="Reembolso")){
      const amt=Number(t.total||0);
      if(t.date<monthStart) opening-=amt;
      else if(t.date>=monthStart && t.date<nextMonth) reimbursements+=amt;
    }
  });
  const closing=Math.max(0,opening+newReceivables-reimbursements);
  return {opening:Math.max(0,opening),newReceivables,reimbursements,closing,openingDate,openingAmount};
}
function currentReceivableBalance(){
  const opening=Number(state.settings.openingReceivable||0);
  let added=0,received=0;
  state.transactions.forEach(t=>{
    if(t.type==="expense" && Number(t.reimbursable||0)>0 && !t.receivableIncludedInOpening) added+=Number(t.reimbursable||0);
    if(t.type==="reimbursement" || (t.type==="income" && t.account==="Reembolso")) received+=Number(t.total||0);
  });
  return Math.max(0,opening+added-received);
}
function futureCommitments(k){
  let x=0;
  state.transactions.forEach(tx=>installmentsFor(tx).forEach(i=>{if(i.month>k)x+=i.personal}));
  return x;
}
function paceStatus(spend,budget,k){
  if(!budget) return {label:"Sem meta",cls:"warn"};
  const today=new Date(), [y,m]=k.split("-").map(Number);
  let elapsed;
  if(today.getFullYear()===y && today.getMonth()+1===m) elapsed=today.getDate()/daysInMonth(k);
  else if(new Date(y,m-1,1)<new Date(today.getFullYear(),today.getMonth(),1)) elapsed=1;
  else elapsed=.05;
  const ratio=spend/budget;
  if(ratio>1) return {label:"Fora da meta",cls:"bad"};
  if(ratio>elapsed+.15) return {label:"Ritmo alto",cls:"bad"};
  if(ratio>elapsed+.05) return {label:"Atenção",cls:"warn"};
  return {label:"Dentro",cls:"good"};
}

}

function suggestedPaymentMonth(){
  const date=document.getElementById("fDate")?.value || new Date().toISOString().slice(0,10);
  const method=document.getElementById("fMethod")?.value || "Cartão de crédito";
  const base=txMonth(date);

function syncSuggestedPaymentMonth(){
  const m=document.getElementById("fDueMonth");
  if(m)m.value=suggestedPaymentMonth();
}
function initFormDefaults(){
  const d=document.getElementById("fDate"); if(d)d.value=new Date().toISOString().slice(0,10);
  const m=document.getElementById("fDueMonth"); if(m)m.value=suggestedPaymentMonth();
  const t=document.getElementById("fType"); if(t)t.value="expense";

function toggleExpenseFields(){

function updateIncomeHelp(){

  else if(a==="Salário / Pró-labore") h.innerHTML="<b>Salário / Pró-labore:</b> esta receita passa a ser a renda efetiva usada no mês. Se não houver lançamento, o app usa a renda mensal configurada como referência.";

function submitTx(e){
  e.preventDefault();
  const type=document.getElementById("fType").value, total=Number(document.getElementById("fTotal").value);
  if(!total || total<=0) return alert("Informe um valor maior que zero.");
  const tx={id:uid(),type,date:document.getElementById("fDate").value,description:document.getElementById("fDesc").value.trim(),total,createdAt:new Date().toISOString()};
  if(type==="expense"){
    const pkg=document.getElementById("fPkg").value, acctCode=document.getElementById("fAccount").value;
    const acct=(PKGS[pkg]||[]).find(x=>x[0]===acctCode);
    Object.assign(tx,{package:pkg,accountCode:acctCode,account:acct?acct[1]:"",method:document.getElementById("fMethod").value,
      installments:Number(document.getElementById("fInst").value)||1,currentInstallment:Number(document.getElementById("fCurInst").value)||1,
      dueMonth:document.getElementById("fDueMonth").value||txMonth(tx.date),reimbursable:Number(document.getElementById("fReimb").value)||0,
      person:document.getElementById("fPerson").value.trim(),receivableIncludedInOpening:false});
    if(tx.currentInstallment>tx.installments) return alert("A parcela atual não pode ser maior que o total de parcelas.");
    if(tx.reimbursable>tx.total) return alert("A parte de terceiros não pode ser maior que o valor total.");
  } else if(type==="income"){
    tx.account=document.getElementById("fIncomeAccount")?.value||"Receita extra";
    tx.person=(document.getElementById("fIncomeSource")?.value||"").trim();
    if(tx.account==="Reembolso" && total>currentReceivableBalance()+0.01 && !confirm("Este reembolso é maior que o saldo atual de Contas a Receber. Deseja registrar mesmo assim?")) return;
  }
  state.transactions.push(tx);saveState();
  alert(type==="income" && tx.account==="Reembolso"?"Reembolso registrado e Contas a Receber atualizado.":"Lançamento salvo.");
  setScreen("dashboard");
}

function openNewAssetAccount(){
  const name=prompt("Nome da aplicação (ex.: CDB Liquidez Diária, Tesouro Selic):");
  if(!name)return;
  const institution=prompt("Instituição (ex.: Nubank, Itaú, XP):","")||"";
  const category=prompt("Tipo (ex.: CDB, Tesouro, Fundo, Ações):","CDB")||"Aplicação";
  const raw=prompt("Saldo inicial desta aplicação hoje? Se estiver começando do zero, use 0.","0");
  if(raw===null)return;
  const opening=Number(String(raw).replace(",","."));
  if(!Number.isFinite(opening)||opening<0)return alert("Saldo inicial inválido.");
  state.assetAccounts=state.assetAccounts||[];
  state.assetAccounts.push({id:"asset-"+uid(),name:name.trim(),institution:institution.trim(),category:category.trim(),openingBalance:opening,openingDate:new Date().toISOString().slice(0,10)});
  saveState();renderAll();
}

function openAssetMovement(type,presetAccountId=""){
  const investAccounts=(state.assetAccounts||[]).filter(a=>a.category!=="Caixa");
  if(!investAccounts.length && type!=="application"){alert("Cadastre uma aplicação primeiro.");return;}
  if(type==="application" && !investAccounts.length){openNewAssetAccount();return;}
  let a=investAccounts.find(x=>x.id===presetAccountId);
  if(!a){
    const names=investAccounts.map((x,i)=>`${i+1}. ${x.name} (${x.institution||"sem instituição"})`).join("\\n");
    const ans=prompt(`Escolha a aplicação:\\n${names}`,"1");
    if(ans===null)return;
    a=investAccounts[Number(ans)-1];
    if(!a)return alert("Aplicação inválida.");
  }
  const label=type==="application"?"Valor aplicado":type==="yield"?"Rendimento/valorização":type==="withdrawal"?"Valor resgatado":"Valor";
  const raw=prompt(`${label} em ${a.name}:`,"");
  if(raw===null)return;
  const amount=Number(String(raw).replace(",","."));
  if(!Number.isFinite(amount)||amount<=0)return alert("Valor inválido.");
  if(type==="withdrawal" && amount>assetBalance(a.id)+0.01)return alert("O resgate é maior que o saldo atual da aplicação.");
  const date=prompt("Data (AAAA-MM-DD):",new Date().toISOString().slice(0,10));
  if(!date)return;
  const description=prompt("Descrição (opcional):",type==="application"?"Aplicação financeira":type==="yield"?"Rendimento do período":"Resgate para conta corrente")||"";
  state.assetTransactions=state.assetTransactions||[];
  state.assetTransactions.push({id:"atx-"+uid(),accountId:a.id,type,date,amount,description});
  saveState();renderAll();
}

function reconcileAsset(accountId){
  const a=assetAccountById(accountId);if(!a)return;
  const current=assetBalance(accountId);
  const raw=prompt(`Saldo atual informado pelo banco para ${a.name}:`,String(current.toFixed(2)).replace(".",","));
  if(raw===null)return;
  const informed=Number(String(raw).replace(",","."));
  if(!Number.isFinite(informed)||informed<0)return alert("Saldo inválido.");
  const diff=informed-current;
  if(Math.abs(diff)<0.005)return alert("O saldo já está atualizado.");
  const date=prompt("Data da atualização (AAAA-MM-DD):",new Date().toISOString().slice(0,10));
  if(!date)return;
  state.assetTransactions=state.assetTransactions||[];
  state.assetTransactions.push({id:"atx-"+uid(),accountId:a.id,type:"adjustment",date,amount:diff,description:"Atualização de saldo / rendimento implícito"});
  saveState();renderAll();
}

function deleteAssetTx(id){
  if(!confirm("Excluir esta movimentação patrimonial?"))return;
  state.assetTransactions=(state.assetTransactions||[]).filter(t=>t.id!==id);
  saveState();renderAll();
}

        <td>${t.package?`${t.package}<div class="tiny muted">${t.account||""}</div>`:(t.account||"—")}</td><td class="${t.type==="reimbursement" || (t.type==="income" && t.account==="Reembolso")?'good':''}">${money2(t.total)}</td>
        <td>${t.type==="expense"?`${t.currentInstallment||1}/${t.installments||1}`:"—"}</td><td>${t.reimbursable?money2(t.reimbursable):"—"}</td><td><div class="row" style="gap:5px">${t.type==="expense"?`<button class="btn small" onclick="editReimbursable('${t.id}')">Terceiros</button>`:""}<button class="btn danger small" onclick="deleteTx('${t.id}')">Excluir</button></div>${t.source?`<div class="tiny muted" style="margin-top:5px">Importado</div>`:""}</td></tr>`).join("")}

function openReimbursementForm(){
  setScreen("add");
  setTimeout(()=>{const t=document.getElementById("fType");if(t){t.value="income";toggleExpenseFields();const a=document.getElementById("fIncomeAccount");if(a){a.value="Reembolso";updateIncomeHelp();}const d=document.getElementById("fDesc");if(d)d.value="Reembolso recebido";}},0);
}
function editReimbursable(id){
  const t=state.transactions.find(x=>x.id===id);if(!t || t.type!=="expense")return;
  const current=Number(t.reimbursable||0);
  const raw=prompt("Quanto do VALOR TOTAL desta compra é reembolsável por terceiros?", current || 0);
  if(raw===null)return;
  const val=Number(String(raw).replace(",","."));
  if(!Number.isFinite(val) || val<0 || val>Number(t.total||0)) return alert("Informe um valor entre 0 e o valor total da compra.");
  t.reimbursable=val;
  if(val>0){
    const who=prompt("Qual é a origem do saldo a receber? (amigo, empresa, cliente etc.)",t.person||"");
    if(who!==null)t.person=who.trim();
  }else{
    t.person="";
  }
  saveState();renderAll();
}
function deleteTx(id){
  if(!confirm("Excluir este lançamento?"))return;
  const t=state.transactions.find(x=>x.id===id);
  if(t && t.seedKey){
    state.deletedSeedKeys=state.deletedSeedKeys||[];
    if(!state.deletedSeedKeys.includes(t.seedKey))state.deletedSeedKeys.push(t.seedKey);
  }
  state.transactions=state.transactions.filter(x=>x.id!==id);saveState();renderAll();
}

        <div class="field half"><label>Aportes acumulados antes do app — ${state.settings.openingYear}</label><input id="sOpenInv" type="number" value="${state.settings.openingInvestments||0}"></div>
        <div class="field half"><label>Saldo inicial — Contas a Receber</label><input id="sOpenAR" type="number" step="0.01" value="${state.settings.openingReceivable||0}"></div>
        <div class="field half"><label>Data-base do saldo a receber</label><input id="sOpenARDate" type="date" value="${state.settings.openingReceivableDate||"2026-09-04"}"></div>
        <div class="field full"><label>Nome do lançamento / saldo inicial</label><input id="sOpenARLabel" value="${state.settings.openingReceivableLabel||"Reembolso de amigos"}" placeholder="Ex.: Reembolso de amigos"></div>
      </div>

    </div>
    <div class="card span6">
      <div class="section-title">Plano anual estrutural — 2027</div>

        ${ORDER.filter(p=>annual2027[p]>0).map(p=>`<div class="pkg-mini"><b>${p}</b><span>${money(annual2027[p])}/ano · ${money(STRUCTURAL_2027[p])}/mês médio</span></div>`).join("")}

function saveSettings(){
  state.settings.monthlySalary=Number(document.getElementById("sSalary").value)||25000;
  state.settings.savingsRate=(Number(document.getElementById("sRate").value)||40)/100;
  state.settings.openingPersonalSpend=Number(document.getElementById("sOpenSpend").value)||0;
  state.settings.openingInvestments=Number(document.getElementById("sOpenInv").value)||0;
  state.settings.openingReceivable=Number(document.getElementById("sOpenAR").value)||0;
  state.settings.openingReceivableDate=document.getElementById("sOpenARDate").value||"2026-09-04";
  state.settings.openingReceivableLabel=(document.getElementById("sOpenARLabel")?.value||"").trim()||"Reembolso de amigos";
  saveState();renderAll();alert("Parâmetros salvos.");
}
function saveMonthBudget(){
  const b={};document.querySelectorAll(".budget-input").forEach(i=>b[i.dataset.pkg]=Number(i.value)||0);
  state.budgets[selectedMonth]=b;saveState();renderAll();alert("Metas do mês salvas.");
}
function resetMonthBudget(){
  if(TRANSITION_2026[selectedMonth]) state.budgets[selectedMonth]=JSON.parse(JSON.stringify(TRANSITION_2026[selectedMonth]));
  else state.budgets[selectedMonth]=JSON.parse(JSON.stringify(STRUCTURAL_2027));
  saveState();renderSettings();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});downloadBlob(blob,"meu_plano_financeiro_backup.json");
}
function exportCSV(){
  const head=["data","tipo","descricao","pacote","conta","valor_total","parcelas","parcela_atual","mes_parcela_atual","valor_terceiros","pessoa","origem"];
  const esc=v=>`"${String(v??"").replaceAll('"','""')}"`;
  const rows=state.transactions.map(t=>[t.date,t.type,t.description,t.package,t.account,t.total,t.installments,t.currentInstallment,t.dueMonth,t.reimbursable,t.person,t.source].map(esc).join(";"));
  downloadBlob(new Blob(["\ufeff"+head.join(";")+"\n"+rows.join("\n")],{type:"text/csv;charset=utf-8"}),"lancamentos_financeiros.csv");
}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.settings||!Array.isArray(x.transactions))throw new Error();state=x;state.budgets=state.budgets||makeDefaultBudgets();state.receivables=[];state.deletedSeedKeys=state.deletedSeedKeys||[];state.assetAccounts=state.assetAccounts||[{id:"asset-checking",name:"Conta corrente / reserva",institution:"Conta corrente",category:"Caixa",openingBalance:0,openingDate:"2026-09-01"}];state.assetTransactions=state.assetTransactions||[];state.settings.openingReceivable=state.settings.openingReceivable??0;state.settings.openingReceivableDate=state.settings.openingReceivableDate||"2026-09-04";state.settings.openingReceivableLabel=state.settings.openingReceivableLabel||"Saldo inicial a receber";state.transactions.forEach(t=>{if(t.type==="reimbursement"){t.type="income";t.account="Reembolso";}if(t.type==="investment")t.legacyMovement=true;});saveState();renderAll();alert("Backup importado.");}catch(err){alert("Arquivo de backup inválido.");}};
  r.readAsText(f);
}
function resetApp(){
  if(!confirm("Isso apagará todos os lançamentos e configurações salvos neste navegador. Continuar?"))return;
  state=JSON.parse(JSON.stringify(DEFAULT_STATE));selectedMonth=state.settings.startMonth;saveState();renderAll();
}

function renderAll(){
  document.getElementById("globalMonth").value=selectedMonth;
  renderDashboard();renderBudget();renderAdd();renderTransactions();renderWealth();renderSettings();
}
document.getElementById("globalMonth").onchange=e=>{selectedMonth=e.target.value;renderAll()};
renderAll();
</script>
